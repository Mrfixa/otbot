version: '3.8'

services:
  otp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otp-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PLIVO_AUTH_ID=${PLIVO_AUTH_ID}
      - PLIVO_AUTH_TOKEN=${PLIVO_AUTH_TOKEN}
      - PLIVO_NUMBER=${PLIVO_NUMBER}
      - ADMIN_IDS=${ADMIN_IDS}
      - NGROK_URL=${NGROK_URL}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: ngrok for local development
  ngrok:
    image: wener/ngrok:latest
    container_name: otp-ngrok
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_ADDR=otp-bot:3000
    depends_on:
      - otp-bot
    profiles:
      - dev
